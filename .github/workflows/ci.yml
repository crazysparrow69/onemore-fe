name: CI

# No path filters: `ci-ok` is a required check, and a required check that never
# runs blocks the merge forever.
#
# `push` checks every commit on every branch. `pull_request` stays for PRs from
# forks (their pushes never reach this repository). A PR from a branch of this
# repository therefore gets both runs; that is intended.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# The jobs use no secrets, and `pull_request_target` is not used on purpose (it
# is the classic hole of public repositories).
permissions:
  contents: read

# Required by the Zod env schema. Not a secret. Real environment wins over `.env`.
env:
  PORT: '5002'
  API_URL: http://localhost:5001
  VITE_NEON_AUTH_URL: https://auth.example.test/neondb/auth

# A newer commit cancels the older run of the same event and branch. The event
# name is part of the key so a `push` run never cancels the `pull_request` run
# of the same commit (that would leave a cancelled `ci-ok` on it).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: tsc
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Vite build
        run: pnpm build

  # The only check required by the `main` ruleset. It also succeeds when jobs are
  # skipped, which a plain required check would not.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
